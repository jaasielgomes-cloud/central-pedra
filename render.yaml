services:
  - type: web
    name: central-pedra-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: LEMLIST_API_KEY
        sync: false
      - key: LEMLIST_CAMPAIGN_ID
        sync: false
      - key: LEMLIST_BASE_URL
        value: https://api.lemlist.com/api
      - key: PIPEDRIVE_API_KEY
        sync: false
      - key: PIPEDRIVE_BASE_URL
        value: https://api.pipedrive.com
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
